interface:
  display_name: "乔木通用视频下载"
  short_description: "说“下载这个”加 URL，即可探测并下载在线视频"
  default_prompt: "Use $qiaomu-download whenever I express download/save intent and provide an HTTPS URL, even when I do not say video. Treat phrases such as 下载这个, 保存这个, 把这个下载下来, and download this plus a URL as sufficient activation. Probe the URL with yt-dlp; download when a media extractor succeeds and report a precise unsupported-page error otherwise. Do not auto-download a bare URL without download intent, or requests for webpages, PDFs, images, uploads, summaries, or editing. Explicit platform targets include YouTube, Bilibili, X/Twitter, Douyin, TikTok, Xiaohongshu, Instagram, Facebook, Vimeo, Twitch, Reddit, Weibo, and AcFun, with generic yt-dlp probing for other HTTPS URLs. Run doctor --upgrade once at the start of a new task. Use public extraction first and local browser cookies only after public extraction fails. Keep playlists and overwrites disabled, wait for final JSON, require ffprobe verification, and return absolute paths. Route weixin.qq.com/sph links to qiaomu-wx-video and never automate the WeChat client or embedded pages."
  examples:
    - "下载这个 X 视频：https://x.com/user/status/123"
    - "下载这个：https://v.douyin.com/example"
    - "保存这个 https://www.xiaohongshu.com/explore/example"
    - "把这个 B 站视频保存成 1080p"
    - "提取这个 YouTube 视频的 MP3"
    - "下载这个视频的中英文字幕"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "automatic-or-manual"
    paths: []
  execution:
    context: "local-machine"
    shell: "python3 plus yt-dlp, ffmpeg, and ffprobe"
  trust:
    source_tier: "local-installed-cli"
    remote_inline_execution: "forbid"
    browser_cookies: "public-first-local-fallback"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "target media provider and official yt-dlp release API"
    file_write: "user-selected output directory"
    subprocess: "yt-dlp, ffmpeg, ffprobe, and detected package manager for upgrades"
    interactive: "may be required by the OS when a browser cookie store is protected"
  degradation:
    no_network: "cannot inspect or download"
    no_ytdlp: "dependency error with installation guidance"
    no_ffmpeg: "metadata only; no verified media output"
    no_browser_cookie: "public resources only"
    provider_change: "upgrade yt-dlp and retry"
gates:
  governed:
    - "one public or user-authorized HTTPS media URL"
    - "no playlist and no overwrite"
    - "public-first cookie policy"
    - "ffprobe verification"
    - "absolute output paths"
    - "official stable yt-dlp update check"
    - "WeChat Channels isolation without UI automation"
